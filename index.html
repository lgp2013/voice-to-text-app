<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>实时语音识别录音工具</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 24px;
      color: #00d9ff;
    }

    .settings {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .setting-row:last-child {
      margin-bottom: 0;
    }

    .setting-label {
      font-size: 14px;
      color: #aaa;
      min-width: 80px;
    }

    .setting-value {
      flex: 1;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      color: #00d9ff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }

    .btn-primary {
      background: #00d9ff;
      color: #1a1a2e;
    }

    .btn-primary:hover {
      background: #00b8d4;
    }

    .btn-success {
      background: #4caf50;
      color: white;
    }

    .btn-success:hover {
      background: #45a049;
    }

    .btn-danger {
      background: #f44336;
      color: white;
    }

    .btn-danger:hover {
      background: #da190b;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.2);
      color: white;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .controls {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .status {
      text-align: center;
      padding: 15px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .status-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
      background: #666;
    }

    .status-indicator.recording {
      background: #f44336;
      animation: pulse 1s infinite;
    }

    .status-indicator.listening {
      background: #00d9ff;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .timer {
      font-size: 32px;
      font-weight: bold;
      text-align: center;
      margin: 20px 0;
      font-family: monospace;
    }

    .text-display {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      padding: 20px;
      min-height: 200px;
      max-height: 400px;
      overflow-y: auto;
      margin-bottom: 20px;
    }

    .text-line {
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 16px;
      line-height: 1.6;
    }

    .text-line:last-child {
      border-bottom: none;
    }

    .text-line .time {
      color: #666;
      font-size: 12px;
      margin-right: 10px;
    }

    .text-line .text {
      color: #fff;
    }

    .text-line.interim {
      color: #00d9ff;
    }

    .empty-hint {
      text-align: center;
      color: #666;
      padding: 40px;
    }

    .info {
      text-align: center;
      color: #666;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>实时语音识别录音工具</h1>

    <div class="settings">
      <div class="setting-row">
        <span class="setting-label">保存路径:</span>
        <div class="setting-value" id="savePath">加载中...</div>
        <button class="btn-secondary" onclick="selectPath()">选择目录</button>
      </div>
    </div>

    <div class="controls">
      <button class="btn-success" id="startBtn" onclick="startRecording()">开始录音</button>
      <button class="btn-danger" id="stopBtn" onclick="stopRecording()" disabled>停止录音</button>
    </div>

    <div class="status">
      <span class="status-indicator" id="statusIndicator"></span>
      <span id="statusText">等待开始</span>
    </div>

    <div class="timer" id="timer">00:00:00</div>

    <div class="text-display" id="textDisplay">
      <div class="empty-hint">点击"开始录音"按钮开始语音识别</div>
    </div>

    <div class="info">
      提示：需要麦克风权限，请在浏览器提示时允许访问
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
